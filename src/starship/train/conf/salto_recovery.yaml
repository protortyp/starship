defaults:
  - train
  - _self_

experiment: salto_recovery
device: cuda:0
iterations: 500
eval_interval: 10
record_every: 2

# The state envelope handed off by the salto policy: near 2 km, almost upright, with meaningful
# residual pitch/yaw rate. This isolates recovery and pad landing from learning the rotation.
curriculum:
  enabled: false

sim:
  spawn:
    altitude: 2000
    altitude_noise: 250
    offset: 0
    offset_noise: 100
    vertical_speed: 0
    vertical_speed_noise: 8
    horizontal_speed: 0
    horizontal_speed_noise: 8
    pitch: 0
    pitch_noise: 0.35
    angular_rate_noise: 0.9
    flap_angle: 0.7853981633974483
    lit_throttle: 0.4
  max_time: 90
  max_altitude: 5000
  max_offset: 3000
  max_pitch: 3.141592653589793
  max_rate: 10
  max_roll_rate: 10

reward:
  speed_weight: 5
  tilt_weight: 20
  tilt_height: 3000
  angular_rate_cost: 0.1
  landed_bonus: 200

runner:
  algorithm:
    learning_rate: 3.0e-5
    entropy_coef: 0.0002
