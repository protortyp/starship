      overrides:
        - sim.landing.pad_radius=350
        - sim.landing.max_vertical_speed=25
        - sim.landing.max_horizontal_speed=15
  - name: brake and recover toward 20 m/s
    interpolate:
      steps: 9
      overrides:
        - sim.landing.pad_radius=300
        - sim.landing.max_vertical_speed=20
        - sim.landing.max_horizontal_speed=12
        - sim.landing.max_tilt=1.0471975511965976
        - sim.landing.max_angular_rate=1.5707963267948966
  - name: controlled touchdown toward 16 m/s
    interpolate:
      steps: 4
      overrides:
