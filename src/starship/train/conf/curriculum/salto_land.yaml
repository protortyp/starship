      - sim.landing.max_vertical_speed=77.4609375
      - sim.landing.max_horizontal_speed=38.73046875
      - sim.landing.max_tilt=1.8910225048502625
      - sim.landing.max_angular_rate=3.782045009700535
  # The first bisection crossed the gate in isolated evaluations but did not produce consecutive
  # passes in either 140 short-patience or 140 long-patience updates. Bisect once more so the
  # inherited actor can make the braking behavior reliable before tightening further.
  - name: 41 brake below 77.421875 m/s
    overrides:
      - sim.landing.pad_radius=737.109375
      - sim.landing.max_vertical_speed=77.421875
      - sim.landing.max_horizontal_speed=38.7109375
      - sim.landing.max_tilt=1.889345928001805
      - sim.landing.max_angular_rate=3.77869185600362
