        - sim.landing.max_vertical_speed=16
        - sim.landing.max_horizontal_speed=10
        - sim.landing.max_tilt=0.7853981633974483
        - sim.landing.max_angular_rate=1.0471975511965976
  - name: controlled touchdown toward 12 m/s
    interpolate:
