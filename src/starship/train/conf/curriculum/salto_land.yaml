      - sim.landing.max_vertical_speed=96.25
      - sim.landing.max_horizontal_speed=48.5
      - reward.speed_weight=10
  - name: 17 brake below 95 m/s
    overrides:
      - sim.landing.pad_radius=950
      - sim.landing.max_vertical_speed=95
      - sim.landing.max_horizontal_speed=48
  - name: 18 brake below 93.75 m/s
    overrides:
      - sim.landing.pad_radius=937.5
      - sim.landing.max_vertical_speed=93.75
      - sim.landing.max_horizontal_speed=47.5
  - name: 19 brake below 92.5 m/s
    overrides:
      - sim.landing.pad_radius=925
      - sim.landing.max_vertical_speed=92.5
