      - sim.landing.max_vertical_speed=87.5
      - sim.landing.max_horizontal_speed=44
  - name: 24 brake below 86.25 m/s
    overrides:
      - sim.landing.pad_radius=843.75
      - sim.landing.max_vertical_speed=86.25
      - sim.landing.max_horizontal_speed=43
