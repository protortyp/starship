  # deterministic policy landed 35.4% and its failed contacts averaged 86.1 m/s. Use
  # half-steps through this narrow braking boundary before returning to larger changes.
  - name: 25 brake below 85.625 m/s
    overrides:
      - sim.landing.pad_radius=834.375
      - sim.landing.max_vertical_speed=85.625
      - sim.landing.max_horizontal_speed=42.5
