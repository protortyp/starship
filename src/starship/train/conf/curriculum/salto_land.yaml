  # The direct 70 -> 60 m/s transition produced zero train and deterministic landings for 311
  # adapter updates, while the inherited stage-73 policy had just crossed 50%. Interpolate the
  # three coupled limits before retrying the original boundary.
  - name: 74 brake below 67.5 m/s
    overrides:
      - sim.landing.pad_radius=687.5
      - sim.landing.max_vertical_speed=67.5
      - sim.landing.max_horizontal_speed=34.25
  - name: 75 brake below 65 m/s
    overrides:
      - sim.landing.pad_radius=675
      - sim.landing.max_vertical_speed=65
      - sim.landing.max_horizontal_speed=33.5
  - name: 76 brake below 62.5 m/s
    overrides:
      - sim.landing.pad_radius=662.5
      - sim.landing.max_vertical_speed=62.5
      - sim.landing.max_horizontal_speed=32.75
  - name: 77 brake below 60 m/s
    overrides:
      - sim.landing.pad_radius=650
      - sim.landing.max_vertical_speed=60
      - sim.landing.max_horizontal_speed=32
  # The original post-60 schedule jumped 10 m/s and 75 m at once. Earlier braking evidence needed
  # at most 1.25 m/s, 0.75 m/s horizontal speed and 12.5 m pad changes, so expand these compact
  # waypoints into bounded cumulative stages. Attitude changes are likewise capped near 5 degrees
  # and angular-rate changes near 10 degrees/s.
  - name: brake toward 50 m/s
    interpolate:
      steps: 8
      overrides:
        - sim.landing.pad_radius=575
        - sim.landing.max_vertical_speed=50
        - sim.landing.max_horizontal_speed=28
  - name: brake toward 40 m/s
    interpolate:
      steps: 8
      overrides:
        - sim.landing.pad_radius=500
        - sim.landing.max_vertical_speed=40
        - sim.landing.max_horizontal_speed=25
