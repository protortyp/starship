  # The coupled midpoint stayed flat for more than 300 continuous-head updates. Its 1,024-episode
  # probe attributed 71% of crashes to horizontal speed and 44% to pad miss, but only 28% to
  # vertical speed and none to attitude/rate. Isolate the two binding limits before changing the
  # already-satisfied ones.
  - name: 56 reduce horizontal speed below 36.8359375 m/s
    overrides:
      - sim.landing.max_horizontal_speed=36.8359375
      - reward.horizontal_speed_weight=0.5
  - name: 57 tighten pad radius to 718.359375 m
    overrides:
