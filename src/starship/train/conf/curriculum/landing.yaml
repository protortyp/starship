# @package curriculum
# docs/curriculum.md. Each stage changes one thing on top of the earlier ones; spawn values are
# centre +- noise (uniform).
enabled: true
promote_landed: 0.9
promote_evals: 2
stages:
  - name: 0 landing burn (upright, engines lit, 150-450 m)
    overrides:
      - sim.spawn.altitude=300
      - sim.spawn.altitude_noise=150
      - sim.spawn.vertical_speed=-50
      - sim.spawn.vertical_speed_noise=15
      - sim.spawn.pitch=0
      - sim.spawn.pitch_noise=0.1
      - sim.spawn.offset_noise=50
      - sim.spawn.horizontal_speed_noise=5
      - sim.spawn.angular_rate_noise=0.02
      - sim.spawn.lit_throttle=0.7
      - sim.max_time=60
  - name: 1 engines off at spawn
    overrides:
      - sim.spawn.lit_throttle=0
  - name: 2 low belly-flop (0.9-1.5 km)
    overrides:
      - sim.spawn.altitude=1200
      - sim.spawn.altitude_noise=300
      - sim.spawn.vertical_speed=-90
      - sim.spawn.vertical_speed_noise=10
      - sim.spawn.pitch=1.5708
      - sim.spawn.offset_noise=100
      - sim.max_time=90
      # The belly-flop is the right attitude up high; reward uprightness only near the flip.
      - reward.tilt_height=300
  - name: 3 belly-flop from 3 km
    overrides:
      - sim.spawn.altitude=3000
      - sim.spawn.altitude_noise=500
      - sim.max_time=120
  - name: 4 randomized (1.5-5 km, speed, offset, pitch, spin)
    overrides:
      - sim.spawn.altitude=3250
      - sim.spawn.altitude_noise=1750
      - sim.spawn.vertical_speed=-90
      - sim.spawn.vertical_speed_noise=25
      - sim.spawn.horizontal_speed_noise=20
      - sim.spawn.offset_noise=500
      - sim.spawn.pitch_noise=0.26
      - sim.spawn.angular_rate_noise=0.05
      - sim.max_time=180
  - name: 5 attitude costs at half weight
    overrides:
      - reward.roll_travel_cost=1
      - reward.horizontal_rotation_cost=1
      - reward.sideslip_cost=0.25
      - reward.reflip_cost=2.5
  - name: 6 attitude costs at full weight
    overrides:
      # 2/rad costs 25.8 for the measured 7.2 + 5.7 rad, versus 3.2 for one clean flip.
      # Sideslip costs at most 0.5/s; a reflip costs 5, more than one clean flip.
      - reward.roll_travel_cost=2
      - reward.horizontal_rotation_cost=2
      - reward.sideslip_cost=0.5
      - reward.reflip_cost=5
  - name: 7 roll limit 60 deg/s
    overrides:
      - sim.max_roll_rate=1.0471975511965976
  - name: 8 roll limit 45 deg/s
    overrides:
      - sim.max_roll_rate=0.7853981633974483
  # Wind stages (docs/robustness.md item 6): surface wind at 10 m uniform in 0..max with random
  # direction, winds aloft growing to a jet at 12 km, Dryden severity uniform in 0..level.
  - name: 9 wind light (surface 0-5 m/s, light turbulence)
    overrides:
      - sim.wind.surface_speed=5
      - sim.wind.jet_speed=10
      - sim.wind.turbulence=1
  - name: 10 wind moderate (0-10 m/s, moderate turbulence, gusts)
    overrides:
      - sim.wind.surface_speed=10
      - sim.wind.jet_speed=20
      - sim.wind.turbulence=2
      - sim.wind.gust_speed=6
  - name: 11 wind strong (0-15 m/s)
    overrides:
      - sim.wind.surface_speed=15
      - sim.wind.jet_speed=30
      - sim.wind.gust_speed=9
  - name: 12 wind vortex shedding and flap force noise
    overrides:
      - sim.wind.shedding_amplitude=0.1
      - sim.wind.flap_noise=0.15
  - name: 13 bounded distance shaping (same spawns)
    overrides:
      - reward.distance_saturation=1000
  - name: 14 forward handover at 5 km (34-59 m/s horizontal)
    overrides:
      - sim.spawn.entry=true
      - sim.spawn.altitude=5000
      - sim.spawn.altitude_noise=250
      - sim.spawn.speed=110
      - sim.spawn.speed_noise=5
      - sim.spawn.flight_path_angle=1.1344640137963142
      - sim.spawn.flight_path_angle_noise=0.10471975511965977
      - sim.spawn.heading_noise=0.03490658503988659
      - sim.spawn.offset_noise=100
      - sim.spawn.pitch=1.5707963267948966
      - sim.spawn.pitch_noise=0.05
      - sim.max_time=240
  - name: 15 handover at 8 km (200 m/s, 55-65 deg)
    overrides:
      - sim.spawn.altitude=8000
      - sim.spawn.altitude_noise=500
      - sim.spawn.speed=200
      - sim.spawn.speed_noise=10
      - sim.spawn.flight_path_angle=1.0471975511965976
      - sim.spawn.flight_path_angle_noise=0.08726646259971647
  - name: 16 handover at 12 km
    overrides:
      - sim.spawn.altitude=12000
  - name: 17 IFT-5 handover at 20 km (280 m/s, 64 deg)
    overrides:
      - sim.spawn.altitude=20000
      - sim.spawn.speed=280
      - sim.spawn.flight_path_angle=1.117010721276371
      - sim.spawn.flight_path_angle_noise=0.05235987755982989
