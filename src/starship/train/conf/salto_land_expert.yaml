defaults:
  - salto_land
  - _self_

# Resume a capable salto checkpoint and fork its controller at the monotonic loop-complete
# observation. Checkpoint migration makes the fork action-exact initially; PPO then trains only the
# landing copy, so no recovery update can alter the stunt. A critic-only adaptation precedes the
# deliberately long actor horizon.
experiment: salto_land_expert
iterations: 2000
record_every: 0

reward:
  reflip_cost: 10

runner:
  algorithm:
    learning_rate: 1.0e-4
    # The complete expert has far more jointly moving parameters than the old final-output head.
    # A measured 1e-6 calibration drove 1/8 landing from ~40% to ~30% in 68 actor updates.
    post_warmup_learning_rate: 2.5e-7
    # Keep the value function responsive without taking larger policy steps.
    post_warmup_critic_learning_rate: 1.0e-6
    critic_warmup_updates: 100
    actor_update_scope: landing_expert
  actor:
    class_name: starship.train.models:ContinuousAdapterRNNModel
    continuous_adapter_hidden_dim: 64
    engine_adapter_hidden_dim: 32
    post_loop_adapter_hidden_dim: 128
    touchdown_adapter_hidden_dim: 128
    post_loop_progress_threshold: 0.999999
    touchdown_altitude_threshold: 0.3333333333333333
    landing_expert: true
    resample_engine_count_post_loop: true
    resample_engine_count_touchdown: true
    distribution_cfg:
      # Explore steering enough to remove the systematic recovery rotation while leaving the
      # already-sensitive landing-burn throttle schedule nearly deterministic.
      std_range: [0.02, 0.02]
      std_range_overrides:
        throttle: [0.005, 0.005]
      stochastic_engine_selection: ranked_count
      ranked_count_temperature: 0.55
      ranked_count_hold_steps: 1000
