defaults:
  - train
  - override curriculum: landing_expert
  - _self_

# Transfer a frozen salto checkpoint into a touchdown-only curriculum. The phase expert is active
# for every pretraining state, learns progressively tighter safety gates on one fixed spawn
# distribution, then can be loaded back under salto_land_expert where its normal progress gate
# protects the stunt.
experiment: landing_expert_pretrain
device: cuda:0
iterations: 6000
record_every: 0
load_checkpoint_curriculum: false
reset_critic: true
reset_actor_optimizer: true

# Before the first sparse landing, the default fuel charge makes an immediate engine-off crash
# score slightly above the stable centre-engine descent. Learn braking first; fuel efficiency is
# irrelevant to the strict touchdown gate and remains measurable after transfer.
reward:
  fuel_cost: 0.0
  fuel_bonus: 0.0
  # Once the burn learns vertical speed, total 3-D distance is dominated by altitude and permits
  # a 40--80 m lateral drift. This dedicated near-ground potential solved the same failure in the
  # salto landing curriculum while leaving the strict 15 m terminal gate unchanged.
  horizontal_distance_weight: 0.10

runner:
  algorithm:
    critic_warmup_updates: 100
    post_warmup_learning_rate: 3.0e-5
    post_warmup_critic_learning_rate: 3.0e-5
    actor_update_scope: landing_expert
  actor:
    class_name: starship.train.models:ContinuousAdapterRNNModel
    continuous_adapter_hidden_dim: 64
    engine_adapter_hidden_dim: 32
    post_loop_adapter_hidden_dim: 128
    touchdown_adapter_hidden_dim: 128
    landing_expert: true
    # Train a Markov landing controller whose actions cannot depend on the reset-vs-handoff state
    # of the frozen salto LSTM. Channel 27 is forced to the exact completed-loop value it has in
    # deployment instead of inheriting the general landing task's pad-miss meaning.
    landing_direct_hidden_dim: 256
    # The persistent ranked-count decoder samples only at phase boundaries. Start from the stable
    # centre engine at the simulator's 70% lit throttle. Nearest-count decoding puts the zero-engine
    # boundary far enough away to avoid the observed engine-off shortcut while PPO learns steering.
    landing_direct_engine_logit_biases: [2.0, -2.0, -2.0]
    landing_direct_throttle_bias: 0.0
    landing_progress_override: 1.0
    update_landing_normalization: true
    post_loop_progress_threshold: 0.0
    touchdown_altitude_threshold: 0.3333333333333333
    resample_engine_count_post_loop: true
    resample_engine_count_touchdown: true
    distribution_cfg:
      # Nearest-count decoding can represent zero through all three engines and matches the
      # exploratory count mode, while the ranked logits keep the centre engine unambiguous.
      deterministic_engine_selection: round_expected
      stochastic_engine_selection: ranked_count
      ranked_count_temperature: 0.55
      ranked_count_hold_steps: 1000
      std_range: [0.05, 2.0]
