defaults:
  - train_schema
  - _self_

experiment: landing
num_envs: 4096
device: null
seed: 0
iterations: 500

runner:
  num_steps_per_env: 32
  save_interval: 50
  check_for_nan: true
  logger: tensorboard
  multi_gpu: null
  obs_groups:
    actor: [policy]
    critic: [policy]
  algorithm:
    class_name: PPO
    num_learning_epochs: 5
    num_mini_batches: 4
    learning_rate: 1.0e-3
    schedule: adaptive
    desired_kl: 0.01
    # ~10 s horizon at 20 Hz; the flip and landing burn span the last ~15 s of an episode.
    gamma: 0.995
    lam: 0.95
    entropy_coef: 0.01
    clip_param: 0.2
    value_loss_coef: 1.0
    max_grad_norm: 1.0
  actor:
    class_name: MLPModel
    hidden_dims: [128, 128]
    activation: elu
    obs_normalization: true
    distribution_cfg:
      class_name: starship.train.distribution:BernoulliDistribution
  critic:
    class_name: MLPModel
    hidden_dims: [128, 128]
    activation: elu
    obs_normalization: true

hydra:
  run:
    dir: logs/${experiment}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
