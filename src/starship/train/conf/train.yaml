defaults:
  - train_schema
  - curriculum: none
  - _self_

experiment: landing
num_envs: 4096
device: null
seed: 0
iterations: 500
eval_interval: 25
eval_envs: 256
rollback_drop: 0.5
rollback_patience: 2
record_every: 4
record_envs: 16
checkpoint: null

reward:
  gamma: ${runner.algorithm.gamma}

sim:
  # Curriculum: start some training episodes near the ground; eval always uses the full scenario.
  easy_spawn_fraction: 0.3

runner:
  num_steps_per_env: 32
  save_interval: 50
  check_for_nan: true
  multi_gpu: null
  obs_groups:
    actor: [policy]
    critic: [policy]
  algorithm:
    class_name: starship.train.ppo:InstrumentedPPO
    num_learning_epochs: 5
    num_mini_batches: 4
    learning_rate: 1.0e-3
    schedule: adaptive
    desired_kl: 0.01
    # ~100 s horizon at 10 Hz, so terminal rewards reach the start of a ~40 s episode.
    gamma: 0.999
    lam: 0.95
    entropy_coef: 0.01
    clip_param: 0.2
    value_loss_coef: 1.0
    max_grad_norm: 1.0
    # Critic predicts returns normalized by their running mean and std. Off: it made learning
    # collapse on near-ground spawns (16% then 0% at 250 it, vs 81% without; docs/curriculum.md).
    value_normalization: false
    # Log network health (dormant/dead units, feature rank, LSTM gates, per-layer norms) every N updates.
    diagnostics_interval: 10
  actor:
    class_name: RNNModel
    rnn_type: lstm
    rnn_hidden_dim: 128
    rnn_num_layers: 1
    hidden_dims: [128, 128]
    activation: elu
    obs_normalization: true
    distribution_cfg:
      class_name: starship.train.distribution:BernoulliDistribution
  critic:
    class_name: RNNModel
    rnn_type: lstm
    rnn_hidden_dim: 128
    rnn_num_layers: 1
    hidden_dims: [128, 128]
    activation: elu
    obs_normalization: true

hydra:
  run:
    dir: logs/${experiment}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
